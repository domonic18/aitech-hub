# 生产反代主配置(arch/06-project-structure 规划布局:主配置 + templates/aitech-hub.conf.template)
# nginx 唯一对外;/wp-content/uploads/** 反代媒体桶(M19 批④,URL 不变);其余全量反代 web
worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;

  # 站点配置:镜像 templates 机制 envsubst 生成(M19 批④);
  # default.conf 由 compose 文件级挂载 mask 文件顶替
  include /etc/nginx/conf.d/*.conf;
}
