# 站点配置(standard/02-cicd-deployment §4):legacy 承接在应用层路由((site)/[slug] 单段 + category/tag
# 页内 fallback),nginx 不做 error_page 拦截

# 磁盘媒体文件名为 percent-encoded(与 DB/HTML 中的编码一致);常规 alias 按
# 解码后 URI 找文件,中文文件名必 404 —— 改用未解码原始请求串拼磁盘路径。
# 变量进 alias 不二次解码,编码后的 %2f 不会被还原成路径分隔符,无穿越面。
map $request_uri $media_uri {
  ~^/wp-content/uploads/([^?]*) $1;
  default "";
}

server {
  listen 80;
  server_name 17aitech.com www.17aitech.com;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name 17aitech.com www.17aitech.com;

  # 证书沿用旧站 workspace/ssl 目录(compose 卷挂载);文件名须为 letsencrypt 惯例
  ssl_certificate /etc/nginx/ssl/fullchain.pem;
  ssl_certificate_key /etc/nginx/ssl/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  # 旧 WP feed(:/feed/ → 301 /feed.xml,原站约定)
  location = /feed {
    return 301 /feed.xml;
  }
  location = /feed/ {
    return 301 /feed.xml;
  }

  # 迁移媒体(154 篇文章引用图)直服,immutable 长缓存;二期切 COS 反代 URL 不变
  # 正则吃满整个 URI:alias 带变量时 nginx 会追加"匹配后剩余 URI(已解码)",
  # 不吃满会把解码文件名再拼一遍(实测 open() 路径成双段 404)
  location ~ ^/wp-content/uploads/.+ {
    alias /var/www/media/$media_uri;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # proxy_pass 无 URI 部分:原始请求串(含中文 percent-encoded slug)原样透传
  location / {
    proxy_pass http://web:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }
}
