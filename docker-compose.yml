# dev 依赖:仅 postgres/redis,应用本地跑保热更(arch/00-overview §6)
# 端口避让:本机 5432/5433(agent-eval、ai-invest)与 6379(ai-invest)已占
# 持久化:全部收敛到 ./workspace/(PG 数据库;dev redis 无持久化,重启即失)
services:
  postgres:
    image: postgres:16-alpine
    container_name: aitech_hub_pg
    environment:
      POSTGRES_USER: aitech
      POSTGRES_PASSWORD: aitech
      POSTGRES_DB: aitech_hub
    ports:
      - "5434:5432"
    volumes:
      - ./workspace/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aitech -d aitech_hub"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: aitech_hub_redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
