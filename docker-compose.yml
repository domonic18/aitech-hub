# dev 依赖:postgres/redis + douyin-gateway(M8,按需 --profile douyin)
# 端口避让:本机 5432/5433(agent-eval、ai-invest)与 6379(ai-invest)已占
# 持久化:全部收敛到 ./workspace/(PG 数据库;dev redis 无持久化,重启即失)
services:
  postgres:
    image: postgres:16-alpine
    container_name: aitech_hub_pg
    environment:
      POSTGRES_USER: aitech
      POSTGRES_PASSWORD: aitech
      POSTGRES_DB: aitech_hub
    ports:
      - "5434:5432"
    volumes:
      - ./workspace/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aitech -d aitech_hub"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: aitech_hub_redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  # 抖音数据网关(M8):签名 sidecar + 数据端点;按需启用,不影响日常 pg/redis 起
  # 停:docker compose --profile douyin up -d douyin-gateway;冒烟 curl 127.0.0.1:8010/health
  douyin-gateway:
    build: { context: ./douyin-gateway }
    container_name: aitech_hub_douyin_gateway
    profiles: ["douyin"]
    environment:
      TZ: Asia/Shanghai
      DOUYIN_SIGNER_WARM_SLOTS: 1 # dev 单槽位足够
    ports:
      - "127.0.0.1:8010:8010" # 仅回环,便于本机 curl 冒烟
    tmpfs:
      - /tmp/playwright-profiles
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request as u; u.urlopen('http://127.0.0.1:8010/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
