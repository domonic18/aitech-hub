# 生产全栈(standard/02-cicd-deployment §4):nginx 唯一对外,web/worker/pg/redis 仅内网
# 部署:docker compose -f docker-compose.prod.yml pull && docker compose -f docker-compose.prod.yml up -d
# 本地验证:APP_IMAGE=aitech-hub:m3 docker compose -f docker-compose.prod.yml up -d
#   (需 .env 配 POSTGRES_PASSWORD;workspace/ssl 放 fullchain.pem/privkey.pem;
#   workspace/media 为迁移媒体——宿主机持久化数据统一收敛在 ./workspace/)
name: aitech-hub-prod

x-restart: &restart
  restart: unless-stopped

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# 应用容器公共环境:.env 提供业务变量(AUTH_SECRET/NEXT_PUBLIC_SITE_URL/SMS 等),
# 数据面地址在这里覆盖为容器网内主机名(.env 里的 localhost 系 dev 值)
x-app-env: &app-env
  DATABASE_URL: postgresql://aitech:${POSTGRES_PASSWORD:?请在 .env 配置 POSTGRES_PASSWORD}@postgres:5432/aitech_hub?connection_limit=10
  REDIS_URL: redis://redis:6379/0
  # 抖音网关容器网内地址(.env 里的 127.0.0.1:8010 是 dev 值;M8)
  DOUYIN_GATEWAY_URL: http://douyin-gateway:8010
  # environment 优先级高于 env_file(.env):容器内媒体路径钉死为挂载点,不随宿主 .env 漂移
  MEDIA_DIR: /app/media

services:
  nginx:
    image: nginx:1.28-alpine
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    # M19 批④:COS_MEDIA_HOST(媒体桶公网域名 <bucket>.cos.<region>.myqcloud.com)
    # 经官方镜像 templates 机制 envsubst 注入站点模板,生成容器内 conf.d/aitech-hub.conf
    environment:
      COS_MEDIA_HOST: ${COS_MEDIA_HOST:?请在 .env 配置 COS_MEDIA_HOST(媒体桶公网域名,不含 https://)}
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/templates:/etc/nginx/templates:ro # 启动时 envsubst → 容器内 /etc/nginx/conf.d/
      - ./docker/nginx/conf.d/default.conf.mask:/etc/nginx/conf.d/default.conf:ro # 遮盖镜像自带 default.conf
      - ./workspace/ssl:/etc/nginx/ssl:ro
      # 回滚通道:反代观察期保留本地媒体卷只读挂载,conf 换回 alias + up -d nginx 即回
      - ./workspace/media:/var/www/media:ro
      # M19 批④ 反代缓存;宿主目录属主须 101:101(nginx worker),否则仅缓存不可写、不拒服务
      - ./workspace/nginx-cache:/var/cache/nginx
    depends_on:
      web:
        condition: service_healthy
    mem_limit: 128m
    <<: *restart
    logging: *logging

  web:
    image: ${APP_IMAGE:-ccr.ccs.tencentyun.com/domonic18/aitech-hub:latest}
    # 本地构建验收镜像:APP_IMAGE=aitech-hub:opt-xxx BUILD_REF=opt-xxx \
    #   docker-compose -f docker-compose.prod.yml build web
    # (worker 共用该镜像,build 一次即可;CI 镜像由 GitHub Actions 构建推 TCR,不经此处;
    #  FFMPEG_BINARIES_URL 缺省注入 npmmirror 镜像源——ffmpeg-static postinstall 走
    #  github release,docker VM 直连常被 reset(2026-10-05 实测);置空串可强制回退 github)
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        BUILD_REF: ${BUILD_REF:-}
        BUILD_TIME: ${BUILD_TIME:-}
        FFMPEG_BINARIES_URL: ${FFMPEG_BINARIES_URL:-https://registry.npmmirror.com/-/binary/ffmpeg-static}
    # SERVICE_ROLE=web:entrypoint 先 prisma migrate deploy,再起 server + ISR 预热
    environment:
      SERVICE_ROLE: web
      <<: *app-env
    env_file:
      - .env
    volumes:
      # 读写:M14 起媒体库/编辑器上传经 web 路由同步写盘(曾 ro 挂载致 EROFS 500,M16 修复)
      - ./workspace/media:/app/media
    ports:
      - "127.0.0.1:3000:3000" # 宿主回环发布:切换日 runbook curl 127.0.0.1:3000 验证用
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # slim 无 curl,用 node;尾斜杠必带(trailingSlash 下 /api/health 308)
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://127.0.0.1:3000/api/health/'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s # 首启含全量 migrate deploy,放宽
    mem_limit: 768m
    <<: *restart
    logging: *logging

  worker:
    image: ${APP_IMAGE:-ccr.ccs.tencentyun.com/domonic18/aitech-hub:latest}
    environment:
      SERVICE_ROLE: worker
      <<: *app-env
    env_file:
      - .env
    volumes:
      - ./workspace/media:/app/media # 媒体异步任务(M4)读写
      # M19 批② db-backup:备份落盘 + ssl 证书档;挂回 /app/workspace/* 与
      # cwd 相对路径约定(workspace/backups、workspace/ssl)对齐,零 env 覆盖
      - ./workspace/backups:/app/workspace/backups
      - ./workspace/ssl:/app/workspace/ssl:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_healthy # web entrypoint 先 migrate deploy;healthy 即 schema 就绪
    mem_limit: 512m
    <<: *restart
    logging: *logging

  # 抖音数据网关(M8):签名 + 数据端点;仅内网(无 ports,worker 经服务名访问)
  # chromium warm 页吃内存,prod 钉 warm_slots=1 压内存(2C4G 预算)
  douyin-gateway:
    image: ${GATEWAY_IMAGE:-ccr.ccs.tencentyun.com/domonic18/aitech-hub-gateway:latest}
    environment:
      TZ: Asia/Shanghai
      DOUYIN_SIGNER_WARM_SLOTS: 1
    tmpfs:
      - /tmp/playwright-profiles # chromium Profile 写 tmpfs,避免容器层写放大
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request as u; u.urlopen(''http://127.0.0.1:8010/health'')"',
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s # 首启含 chromium 拉起
    mem_limit: 1g
    <<: *restart
    logging: *logging

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aitech
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 配置 POSTGRES_PASSWORD}
      POSTGRES_DB: aitech_hub
      TZ: Asia/Shanghai # 每日 03:30 pg_dump 备份 cron 依本地时区(standard/02-cicd-deployment §6)
    volumes:
      - ./workspace/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aitech -d aitech_hub"]
      interval: 3s
      timeout: 3s
      retries: 20
    mem_limit: 512m
    <<: *restart
    logging: *logging

  redis:
    image: redis:7-alpine
    # AOF 持久化:BullMQ 队列与统计缓冲不因容器重启丢任务
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ./workspace/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    mem_limit: 128m
    <<: *restart
    logging: *logging
