name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  # 强制 GitHub Actions 使用 Node.js 24 runtime(checkout/setup-node 等,消弃用警告;同范例仓)
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  REGISTRY: ccr.ccs.tencentyun.com

jobs:
  app:
    name: app(格式/lint/类型/单测)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --check .
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit

  migrate-replay:
    name: 迁移重放守卫
    runs-on: ubuntu-latest
    # 无条件执行(承袭范例 db-migration-guard):hashFiles 不支持 job 级 if,
    # 曾致 workflow 加载即失败;守卫本身仅 ~1 分钟,换取任何变更都能兜住 schema 漂移
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aitech_hub_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aitech_hub_ci?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 从零全量应用(standard/01-testing §5)
      - run: npx prisma migrate deploy
      # 第二次 deploy 必须无错(exactly-once 台账幂等)
      - run: npx prisma migrate deploy
      # introspect 断言:实际 schema 与 schema.prisma 一致(有差异则非零退出)
      - run: npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code

  # 镜像发布线:两 job 全绿才出镜像,仿 ai-invest-assisstant TCR 模式
  # (standard/02-cicd-deployment §1;跨境推送偶发 stall → 步骤级超时 + 失败重推一次)
  # develop 出 develop-<sha> 供演练;latest 只从 main 出,保证 compose pull 默认拉到发布版
  docker-release:
    name: release(镜像构建推送 TCR)
    runs-on: ubuntu-latest
    needs: [app, migrate-replay]
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')) || github.event_name == 'workflow_dispatch'
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - id: vars
        run: |
          {
            echo "sha_short=$(git rev-parse --short HEAD)"
            echo "branch=$(echo "${GITHUB_REF#refs/heads/}" | tr '/' '-')"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      # id + 重试条件:登录失败属配置错误,不进重试(避免白建镜像且盖住真错;2026-10-02 首跑实测教训)
      - id: login
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}
      # provenance: false——TCR 不认 OCI attestation 附加清单
      - name: Build and Push / 构建并推送(第 1 次尝试)
        uses: docker/build-push-action@v6
        timeout-minutes: 25
        with:
          context: .
          file: docker/Dockerfile
          push: true
          provenance: false
          tags: |
            ${{ env.REGISTRY }}/${{ secrets.TCR_NAMESPACE }}/aitech-hub:${{ steps.vars.outputs.branch }}-${{ steps.vars.outputs.sha_short }}
            ${{ github.ref == 'refs/heads/main' && format('{0}/{1}/aitech-hub:latest', env.REGISTRY, secrets.TCR_NAMESPACE) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and Push / 构建并推送(重试)
        if: failure() && steps.login.conclusion == 'success'
        uses: docker/build-push-action@v6
        timeout-minutes: 30
        with:
          context: .
          file: docker/Dockerfile
          push: true
          provenance: false
          tags: |
            ${{ env.REGISTRY }}/${{ secrets.TCR_NAMESPACE }}/aitech-hub:${{ steps.vars.outputs.branch }}-${{ steps.vars.outputs.sha_short }}
            ${{ github.ref == 'refs/heads/main' && format('{0}/{1}/aitech-hub:latest', env.REGISTRY, secrets.TCR_NAMESPACE) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
