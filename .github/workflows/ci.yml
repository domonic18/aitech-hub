name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  # 强制 GitHub Actions 使用 Node.js 24 runtime(checkout/setup-node 等,消弃用警告;同范例仓)
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  REGISTRY: ccr.ccs.tencentyun.com

jobs:
  app:
    name: app(格式/lint/类型/单测)
    runs-on: ubuntu-latest
    env:
      # 单测导入链(src/lib/ai/* → logger → env.ts)加载即做 zod 形校验;
      # CI 无 .env,补占位值仅为通过形校验,不连任何服务(真实值由部署环境提供)
      DATABASE_URL: postgresql://ci:ci@localhost:5432/aitech_hub_ci?schema=public
      REDIS_URL: redis://localhost:6379/0
      AUTH_SECRET: ci-placeholder-secret-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --check .
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit

  # 抖音网关(M8):pytest 黄金样本对拍(a_bogus 冻结时间逐字节)+ 归因矩阵;仅网关目录变更时跑
  gateway:
    name: gateway(python 单测)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # uv 管理依赖(仿 ai-invest):uv.lock 锚定解析,setup-uv 带锁文件缓存
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: services/douyin-gateway/uv.lock
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - working-directory: services/douyin-gateway
        run: |
          uv sync --frozen
          uv run pytest tests/ -q

  # 卡片渲染服务(M31):纯函数单测(node:test,零依赖零安装);仅校验/白名单逻辑
  card-renderer:
    name: card-renderer(node 单测)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - working-directory: services/card-renderer
        run: npm test

  migrate-replay:
    name: 迁移重放守卫
    runs-on: ubuntu-latest
    # 无条件执行(承袭范例 db-migration-guard):hashFiles 不支持 job 级 if,
    # 曾致 workflow 加载即失败;守卫本身仅 ~1 分钟,换取任何变更都能兜住 schema 漂移
    services:
      postgres:
        # M20 混合检索:CI 库是一次性卷(无 collation 惯性),直接用官方 pgvector 镜像
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aitech_hub_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aitech_hub_ci?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 从零全量应用(standard/01-testing §5)
      - run: npx prisma migrate deploy
      # 第二次 deploy 必须无错(exactly-once 台账幂等)
      - run: npx prisma migrate deploy
      # introspect 断言:实际 schema 与 schema.prisma 一致(有差异则非零退出)
      - run: npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code

  # 镜像发布线:三检查 job 全绿后,app 与网关镜像各自独立 job 并行构建推送
  # (2026-10-04 拆分,仿 ai-invest-assisstant 每镜像一 job:互不拖累,失败可
  #  re-run failed jobs 单镜像重试;standard/02-cicd-deployment §1)
  # develop 出 develop-<sha> 供演练;latest 只从 main 出,保证 compose pull 默认拉到发布版
  # 2026-10-16 构建推送迁 Mac mini self-hosted runner(仿 acore-manager):GitHub 托管
  #  runner 跨境推 TCR 偶发 stall,曾逼出本地 save/scp/load 兜底;自托管机直推国内 TCR
  #  链路快且稳。机内前置(仓外一次性,见 standard/02-cicd-deployment §1):注册
  #  [self-hosted] runner + 预建持久 builder `ci-builder`(buildkitd.toml 配国内
  #  docker.io 镜像源,本地缓存跨 job 复用,弃 gha cache)。Apple Silicon 出 175 所需
  #  amd64:显式 platforms: linux/amd64(Rosetta/QEMU 模拟,首跑冷缓存偏慢属预期)
  docker-release:
    name: release(app 镜像构建推送 TCR)
    runs-on: [self-hosted]
    needs: [app, gateway, migrate-replay]
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')) || github.event_name == 'workflow_dispatch'
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - id: vars
        run: |
          {
            echo "sha_short=$(git rev-parse --short HEAD)"
            echo "branch=$(echo "${GITHUB_REF#refs/heads/}" | tr '/' '-')"
            echo "build_time=$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          } >> "$GITHUB_OUTPUT"
      # 预建持久 builder(见 job 注释);不用 setup-buildx-action——它会另建临时 builder 顶掉选择
      - name: Select builder / 选择构建器
        run: docker buildx use ci-builder
      # id + 重试条件:登录失败属配置错误,不进重试(避免白建镜像且盖住真错;2026-10-02 首跑实测教训)
      - id: login
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}
      # provenance: false——TCR 不认 OCI attestation 附加清单
      # continue-on-error:首推失败不染红 job,成败由 gate 步骤裁定(重试条件须用
      # outcome 而非 failure(),continue-on-error 会把 failure() 归 false)
      - name: Build and Push / 构建并推送(第 1 次尝试)
        id: build1
        continue-on-error: true
        uses: docker/build-push-action@v6
        timeout-minutes: 25
        with:
          context: .
          file: docker/app/Dockerfile
          push: true
          provenance: false
          platforms: linux/amd64
          tags: |
            ${{ env.REGISTRY }}/${{ secrets.TCR_NAMESPACE }}/aitech-hub:${{ steps.vars.outputs.branch }}-${{ steps.vars.outputs.sha_short }}
            ${{ github.ref == 'refs/heads/main' && format('{0}/{1}/aitech-hub:latest', env.REGISTRY, secrets.TCR_NAMESPACE) || '' }}
          build-args: |
            BUILD_REF=${{ steps.vars.outputs.branch }}-${{ steps.vars.outputs.sha_short }}
            BUILD_TIME=${{ steps.vars.outputs.build_time }}
      - name: Build and Push / 构建并推送(重试)
        if: steps.build1.outcome == 'failure' && steps.login.conclusion == 'success'
        id: build-retry
        uses: docker/build-push-action@v6
        timeout-minutes: 30
        with:
          context: .
          file: docker/app/Dockerfile
          push: true
          provenance: false
          platforms: linux/amd64
          tags: |
            ${{ env.REGISTRY }}/${{ secrets.TCR_NAMESPACE }}/aitech-hub:${{ steps.vars.outputs.branch }}-${{ steps.vars.outputs.sha_short }}
            ${{ github.ref == 'refs/heads/main' && format('{0}/{1}/aitech-hub:latest', env.REGISTRY, secrets.TCR_NAMESPACE) || '' }}
          build-args: |
            BUILD_REF=${{ steps.vars.outputs.branch }}-${{ steps.vars.outputs.sha_short }}
            BUILD_TIME=${{ steps.vars.outputs.build_time }}
      - name: Conclude push outcome / 推送结论裁定
        if: always()
        # 任一次尝试成功即 job 成功;两次皆败才判红(run 37106851119 教训:
        # 首推超时→重试成功,job 仍红,误导发布判断)
        run: |
          if [ "${{ steps.build1.outcome }}" = "success" ] || [ "${{ steps.build-retry.outcome }}" = "success" ]; then
            echo "[OK] image push succeeded"
          else
            echo "[FAIL] image push failed in both attempts" >&2
            exit 1
          fi
      - name: Output image info / 输出镜像信息
        run: |
          echo "Image pushed: ${{ env.REGISTRY }}/${{ secrets.TCR_NAMESPACE }}/aitech-hub:${{ steps.vars.outputs.branch }}-${{ steps.vars.outputs.sha_short }}"

  # 网关镜像(M8,独立 Dockerfile):与 app 镜像同语义的独立 job。
  # self-hosted runner / ci-builder / platforms / gate 裁定等语义与 docker-release 同款
  # (逐条教训注释见上,勿只改一处)
  docker-release-gateway:
    name: release(网关镜像构建推送 TCR)
    runs-on: [self-hosted]
    needs: [app, gateway, migrate-replay]
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')) || github.event_name == 'workflow_dispatch'
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - id: vars
        run: |
          {
            echo "sha_short=$(git rev-parse --short HEAD)"
            echo "branch=$(echo "${GITHUB_REF#refs/heads/}" | tr '/' '-')"
          } >> "$GITHUB_OUTPUT"
      - name: Select builder / 选择构建器
        run: docker buildx use ci-builder
      - id: login
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}
      - name: Build and Push gateway / 网关镜像(第 1 次尝试)
        id: gbuild1
        continue-on-error: true
        uses: docker/build-push-action@v6
        timeout-minutes: 25
        with:
          context: .
          file: docker/gateway/Dockerfile
          push: true
          provenance: false
          platforms: linux/amd64
          tags: |
            ${{ env.REGISTRY }}/${{ secrets.TCR_NAMESPACE }}/aitech-hub-gateway:${{ steps.vars.outputs.branch }}-${{ steps.vars.outputs.sha_short }}
            ${{ github.ref == 'refs/heads/main' && format('{0}/{1}/aitech-hub-gateway:latest', env.REGISTRY, secrets.TCR_NAMESPACE) || '' }}
      - name: Build and Push gateway / 网关镜像(重试)
        if: steps.gbuild1.outcome == 'failure' && steps.login.conclusion == 'success'
        id: gbuild-retry
        uses: docker/build-push-action@v6
        timeout-minutes: 30
        with:
          context: .
          file: docker/gateway/Dockerfile
          push: true
          provenance: false
          platforms: linux/amd64
          tags: |
            ${{ env.REGISTRY }}/${{ secrets.TCR_NAMESPACE }}/aitech-hub-gateway:${{ steps.vars.outputs.branch }}-${{ steps.vars.outputs.sha_short }}
            ${{ github.ref == 'refs/heads/main' && format('{0}/{1}/aitech-hub-gateway:latest', env.REGISTRY, secrets.TCR_NAMESPACE) || '' }}
      - name: Conclude push outcome / 推送结论裁定
        if: always()
        # 任一次尝试成功即 job 成功;两次皆败才判红(教训同 docker-release)
        run: |
          if [ "${{ steps.gbuild1.outcome }}" = "success" ] || [ "${{ steps.gbuild-retry.outcome }}" = "success" ]; then
            echo "[OK] gateway image push succeeded"
          else
            echo "[FAIL] gateway image push failed in both attempts" >&2
            exit 1
          fi
      - name: Output image info / 输出镜像信息
        run: |
          echo "Gateway image pushed: ${{ env.REGISTRY }}/${{ secrets.TCR_NAMESPACE }}/aitech-hub-gateway:${{ steps.vars.outputs.branch }}-${{ steps.vars.outputs.sha_short }}"

  # 卡片渲染镜像(M31,独立 Dockerfile):与网关镜像同语义的独立 job(self-hosted /
  # ci-builder / platforms / gate 裁定等逐条教训注释见 docker-release,勿只改一处)
  docker-release-card-renderer:
    name: release(卡片渲染镜像构建推送 TCR)
    runs-on: [self-hosted]
    needs: [app, card-renderer, migrate-replay]
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')) || github.event_name == 'workflow_dispatch'
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - id: vars
        run: |
          {
            echo "sha_short=$(git rev-parse --short HEAD)"
            echo "branch=$(echo "${GITHUB_REF#refs/heads/}" | tr '/' '-')"
          } >> "$GITHUB_OUTPUT"
      - name: Select builder / 选择构建器
        run: docker buildx use ci-builder
      - id: login
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}
      - name: Build and Push card-renderer / 卡片渲染镜像(第 1 次尝试)
        id: cbuild1
        continue-on-error: true
        uses: docker/build-push-action@v6
        timeout-minutes: 25
        with:
          context: .
          file: docker/card-renderer/Dockerfile
          push: true
          provenance: false
          platforms: linux/amd64
          tags: |
            ${{ env.REGISTRY }}/${{ secrets.TCR_NAMESPACE }}/aitech-hub-card-renderer:${{ steps.vars.outputs.branch }}-${{ steps.vars.outputs.sha_short }}
            ${{ github.ref == 'refs/heads/main' && format('{0}/{1}/aitech-hub-card-renderer:latest', env.REGISTRY, secrets.TCR_NAMESPACE) || '' }}
      - name: Build and Push card-renderer / 卡片渲染镜像(重试)
        if: steps.cbuild1.outcome == 'failure' && steps.login.conclusion == 'success'
        id: cbuild-retry
        uses: docker/build-push-action@v6
        timeout-minutes: 30
        with:
          context: .
          file: docker/card-renderer/Dockerfile
          push: true
          provenance: false
          platforms: linux/amd64
          tags: |
            ${{ env.REGISTRY }}/${{ secrets.TCR_NAMESPACE }}/aitech-hub-card-renderer:${{ steps.vars.outputs.branch }}-${{ steps.vars.outputs.sha_short }}
            ${{ github.ref == 'refs/heads/main' && format('{0}/{1}/aitech-hub-card-renderer:latest', env.REGISTRY, secrets.TCR_NAMESPACE) || '' }}
      - name: Conclude push outcome / 推送结论裁定
        if: always()
        # 任一次尝试成功即 job 成功;两次皆败才判红(教训同 docker-release)
        run: |
          if [ "${{ steps.cbuild1.outcome }}" = "success" ] || [ "${{ steps.cbuild-retry.outcome }}" = "success" ]; then
            echo "[OK] card-renderer image push succeeded"
          else
            echo "[FAIL] card-renderer image push failed in both attempts" >&2
            exit 1
          fi
      - name: Output image info / 输出镜像信息
        run: |
          echo "Card-renderer image pushed: ${{ env.REGISTRY }}/${{ secrets.TCR_NAMESPACE }}/aitech-hub-card-renderer:${{ steps.vars.outputs.branch }}-${{ steps.vars.outputs.sha_short }}"
